# Test Runner Server yapılandırması.
# Sunucuyu başlatmadan önce auth_token'ı değiştirin ve projelerinizi tanımlayın.

auth_token: "degistir-beni"
data_dir: "data"
keep_runs: 200          # proje başına saklanacak koşum (log + artefakt) sayısı

projects:
  # Sunucuyu gerçek bir Java projesi olmadan uçtan uca denemek için sahte koşum.
  - id: fake-sim
    name: "Örnek: Sahte Cucumber Simülasyonu"
    path: examples/fake-cucumber-sim
    command: "python3 run.py"
    env:
      FAKE_FAILING: "1"      # deterministik FAIL sayısı
      FAKE_FLAKY: "1"        # ilk koşumda FAIL, retry'da PASS
      FAKE_STEP_DELAY: "0.4" # adım başına saniye
    results:
      cucumber_json: target/cucumber-report.json
    live_progress:
      cucumber_ndjson: target/cucumber-messages.ndjson
    retry:
      enabled: true
      command: "python3 run.py --rerun"
      rerun_file: target/rerun.txt

  # Gerçek Selenium + Cucumber projesi örneği.
